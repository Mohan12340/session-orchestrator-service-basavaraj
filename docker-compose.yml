version: '3.8'

services:
  session-orchestrator-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: session-orchestrator-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AWS_DYNAMODB_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - IDENTITY_CONSENT_SERVICE_URL=http://host.docker.internal:8081
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
    volumes:
      - ./keys:/app/keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dynamodb

  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    container_name: dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
