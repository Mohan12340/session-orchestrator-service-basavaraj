name: Build and Push to AWS ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: Heyyyyy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------
      # 1. SECURITY: Gitleaks Secret Scanning
      # -----------------------------------------------------------
      - name: Check for Hardcoded Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------
      # 2. SETUP JAVA & POPULATE MAVEN CACHE (Prevents Trivy 429)
      # -----------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Resolve Maven Dependencies
        run: |
          chmod +x ./mvnw || true
          if [ -f "./mvnw" ]; then
            ./mvnw dependency:resolve -q
          else
            mvn dependency:resolve -q
          fi

      # -----------------------------------------------------------
      # 2.5 CODE QUALITY: SonarQube Analysis
      # -----------------------------------------------------------
      - name: Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          chmod +x ./mvnw || true
          
          if [ -f "./mvnw" ]; then
            ./mvnw clean package org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=identity-consent-service \
              -Dsonar.projectName="Identity Consent Service" \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.token="$SONAR_TOKEN" \
              -DskipTests
          else
            mvn clean package org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=identity-consent-service \
              -Dsonar.projectName="Identity Consent Service" \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.token="$SONAR_TOKEN" \
              -DskipTests
          fi

      # -----------------------------------------------------------
      # 3. SECURITY: Trivy Filesystem Scan
      # -----------------------------------------------------------
      - name: Run Trivy FS Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # -----------------------------------------------------------
      # 4. AWS AUTHENTICATION
      # -----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------
      # 5. DEPLOY: Build Docker Image Locally
      # -----------------------------------------------------------
      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      # -----------------------------------------------------------
      # 6. SECURITY: Trivy Container Image Scan (Before Push)
      # -----------------------------------------------------------
      - name: Run Trivy Image Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.run_number }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # -----------------------------------------------------------
      # 7. DEPLOY: Push Verified Image to AWS ECR
      # -----------------------------------------------------------
      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # -----------------------------------------------------------
      # 8. NOTIFICATIONS: Slack Alert on Success
      # -----------------------------------------------------------
      - name: Notify Slack on Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: '#00ff00'
          SLACK_TITLE: '✅ CI Pipeline Succeeded: identity-consent-service'
          SLACK_MESSAGE: 'Pipeline completed successfully. Trivy scans passed and image build #${{ github.run_number }} is now available in AWS ECR.'

      # -----------------------------------------------------------
      # 9. NOTIFICATIONS: Slack Alert on Failure
      # -----------------------------------------------------------
      - name: Notify Slack on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: '🚨 CI Pipeline Failed: identity-consent-service'
          SLACK_MESSAGE: 'A pipeline step failed (Gitleaks, SonarQube, Trivy scan, or Docker build/push). Please check the GitHub Actions logs.'
